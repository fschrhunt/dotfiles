# Hide tmux chrome so a single-window session looks like a normal terminal.
set -g status off

# Copy to the local clipboard over mosh: emit OSC 52 from tmux's own copy-mode,
# and force the explicit "c" selection that mosh 1.4.0 requires.
set -g set-clipboard on
set -as terminal-features ',xterm*:clipboard'
set -as terminal-overrides ',xterm*:Ms=\E]52;c;%p2%s\007'
